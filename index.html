<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eiscafe Tiziano – Öffnungszeiten</title>
  <meta name="description" content="Öffnungszeiten von Eiscafe Tiziano: Mitnehmen, Innenbereich und Lieferservice." />

  <style>
    :root{
      --bg:#f3f3f3;
      --surface:#ffffff;
      --surface-soft:#fafafa;
      --text:#111111;
      --muted:#5f6368;
      --line:#dddddd;
      --shadow:0 6px 18px rgba(0,0,0,.08);

      --blue:#3b82f6;
      --orange:#e7a23b;
      --red:#e4554d;
      --gray:#d6d6d6;

      --green-open:#1ea75c;
      --green-open-bg:#e8f7ef;
      --green-open-border:#cfead9;

      --red-closed:#d63b3b;
      --red-closed-bg:#fdecec;
      --red-closed-border:#f3caca;

      --radius-xl:22px;
      --radius-lg:18px;
      --radius-md:14px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    body{
      padding:14px;
    }

    .page{
      max-width:560px;
      margin:0 auto;
    }

    .hero{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:18px 18px 16px;
      margin-bottom:14px;
      text-align:center;
    }

    .logo-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#f7f7f7;
      border:1px solid #e6e6e6;
      border-radius:20px;
      padding:10px 14px;
      margin-bottom:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
    }

    .logo-badge img{
      display:block;
      width:120px;
      max-width:100%;
      height:auto;
      object-fit:contain;
      opacity:.9;
    }

    .eyebrow{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:4px;
    }

    h1{
      margin:0;
      font-size:clamp(34px,8vw,52px);
      line-height:1;
      letter-spacing:-.03em;
    }

    .subtitle{
      margin:8px 0 0;
      font-size:15px;
      color:var(--muted);
      line-height:1.35;
    }

    .today-pill{
      margin-top:14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      background:#f7f7f7;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:14px;
      font-weight:700;
      color:#2f2f2f;
    }

    .status-summary{
      margin-top:12px;
      display:grid;
      gap:8px;
    }

    .summary-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      background:#fafafa;
      border:1px solid #ececec;
      border-radius:14px;
      text-align:left;
    }

    .summary-name{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      font-weight:800;
      color:#222;
      min-width:0;
    }

    .summary-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      flex:0 0 auto;
    }

    .summary-dot.open{ background:var(--green-open); }
    .summary-dot.closed{ background:var(--red-closed); }

    .summary-state{
      flex:0 0 auto;
      font-size:13px;
      font-weight:850;
      padding:6px 9px;
      border-radius:999px;
      border:1px solid transparent;
    }

    .summary-state.open{
      color:var(--green-open);
      background:var(--green-open-bg);
      border-color:var(--green-open-border);
    }

    .summary-state.closed{
      color:var(--red-closed);
      background:var(--red-closed-bg);
      border-color:var(--red-closed-border);
    }

    .cards{
      display:grid;
      gap:14px;
    }

    .card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:16px;
    }

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .card-title-wrap{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width:0;
    }

    .icon{
      width:44px;
      height:44px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:22px;
      flex:0 0 auto;
    }

    .icon.blue{ background:var(--blue); }
    .icon.orange{ background:var(--orange); }
    .icon.red{ background:var(--red); }

    .card h2{
      margin:0;
      font-size:20px;
      line-height:1.1;
      letter-spacing:-.02em;
    }

    .desc{
      margin:4px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.3;
    }

    .status{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 11px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      border:1px solid transparent;
      white-space:nowrap;
    }

    .status::before{
      content:"";
      width:9px;
      height:9px;
      border-radius:50%;
      background:currentColor;
      opacity:.95;
    }

    .status.open{
      color:var(--green-open);
      background:var(--green-open-bg);
      border-color:var(--green-open-border);
    }

    .status.closed{
      color:var(--red-closed);
      background:var(--red-closed-bg);
      border-color:var(--red-closed-border);
    }

    .today-box{
      margin-top:10px;
      background:var(--surface-soft);
      border:1px solid var(--line);
      border-radius:var(--radius-lg);
      padding:12px 13px;
    }

    .today-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      color:var(--muted);
      margin-bottom:4px;
    }

    .today-value{
      font-size:19px;
      font-weight:900;
      line-height:1.2;
      letter-spacing:-.02em;
    }

    .rows{
      margin-top:12px;
      display:grid;
      gap:8px;
    }

    .row{
      display:grid;
      grid-template-columns:auto 1fr;
      gap:12px;
      align-items:center;
      padding:11px 12px;
      border-radius:var(--radius-md);
      background:var(--surface-soft);
      border:1px solid #ececec;
    }

    .row .day{
      font-size:15px;
      font-weight:800;
      min-width:92px;
    }

    .row .time{
      font-size:15px;
      font-weight:700;
      color:#222;
      text-align:right;
    }

    .notice{
      margin-top:12px;
      font-size:14px;
      color:var(--muted);
      line-height:1.35;
    }

    .links{
      margin-top:12px;
      display:grid;
      gap:8px;
    }

    .link-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      text-decoration:none;
      padding:12px 14px;
      border-radius:14px;
      font-weight:800;
      font-size:15px;
      border:1px solid transparent;
      transition:.15s ease;
    }

    .link-btn.primary{
      background:#edf4ff;
      color:#1f5fd1;
      border-color:#d9e7ff;
    }

    .link-btn.secondary{
      background:#fff4e5;
      color:#a86a0a;
      border-color:#f3dfbd;
    }

    .link-btn:hover{
      filter:brightness(.98);
      transform:translateY(-1px);
    }

    .legend{
      margin-top:12px;
      display:flex;
      flex-wrap:wrap;
      gap:10px 14px;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }

    .legend-item{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    .dot{
      width:11px;
      height:11px;
      border-radius:50%;
      display:inline-block;
    }

    .dot.blue{ background:var(--blue); }
    .dot.orange{ background:var(--orange); }
    .dot.red{ background:var(--red); }
    .dot.gray{ background:var(--gray); }

    .footer{
      margin-top:14px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:14px 16px;
      font-size:14px;
      color:var(--muted);
      line-height:1.4;
      text-align:center;
    }

    .footer strong{
      color:var(--text);
    }

    .footer-logo{
      margin-top:10px;
      opacity:.55;
    }

    .footer-logo img{
      width:70px;
      height:auto;
      object-fit:contain;
    }

    @media (min-width: 900px){
      body{
        padding:28px 14px;
      }

      .hero,
      .card,
      .footer{
        box-shadow:0 8px 24px rgba(0,0,0,.09);
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="hero">
      <div class="logo-badge">
        <img src="./logo-tiziano.png" alt="Eiscafe Tiziano Logo">
      </div>

      <div class="eyebrow">Eiscafe Tiziano</div>
      <h1>Öffnungszeiten</h1>
      <p class="subtitle">Mitnehmen · Innen / Gästebereich · Lieferservice</p>
      <div class="today-pill">📅 <span id="todayDate">wird geladen…</span></div>
      <div class="status-summary" id="statusSummary" aria-label="Aktueller Status"></div>
    </header>

    <main class="cards" id="cards"></main>

    <footer class="footer">
      <strong>Eiscafe Tiziano</strong><br>
      Marktstraße 18 · 56727 Mayen

      <div class="footer-logo">
        <img src="./logo-tiziano.png" alt="Eiscafe Tiziano Logo klein">
      </div>
    </footer>
  </div>

  <script>
    const siteLinks = {
      lieferkarte: "https://eiscafetizianomayen.github.io/Lieferkarte/",
      liefergebiete: "https://eiscafetizianomayen.github.io/Liefergebiete/"
    };

    const areas = [
      {
        key: "mitnehmen",
        color: "blue",
        icon: "🍦",
        title: "Mitnehmen",
        description: "Eis, Becher & Getränke zum Mitnehmen",
        notice: "An gesetzlichen Feiertagen in Rheinland-Pfalz gelten die Feiertagszeiten.",
        holidayHours: [{ start: "13:00", end: "21:00" }],
        hours: {
          1: [],
          2: [{ start: "11:00", end: "21:00" }],
          3: [{ start: "11:00", end: "21:00" }],
          4: [{ start: "11:00", end: "21:00" }],
          5: [{ start: "10:30", end: "21:00" }],
          6: [{ start: "10:00", end: "21:00" }],
          0: [{ start: "13:00", end: "21:00" }]
        }
      },
      {
        key: "innen",
        color: "orange",
        icon: "☕",
        title: "Innen / Gästebereich",
        description: "Unsere Sitzplätze im Innen- und Außenbereich",
        notice: "An gesetzlichen Feiertagen in Rheinland-Pfalz gelten die Feiertagszeiten.",
        holidayHours: [{ start: "13:00", end: "19:00" }],
        hours: {
          1: [],
          2: [{ start: "11:00", end: "19:00" }],
          3: [{ start: "11:00", end: "19:00" }],
          4: [{ start: "11:00", end: "19:00" }],
          5: [{ start: "10:30", end: "19:00" }],
          6: [{ start: "10:00", end: "19:00" }],
          0: [{ start: "13:00", end: "19:00" }]
        }
      },
      {
        key: "liefer",
        color: "red",
        icon: "🚗",
        title: "Lieferservice",
        description: "Eis bequem nach Hause liefern lassen",
        notice: "Lieferung nach Absprache auch außerhalb der Zeiten möglich.",
        holidayHours: [{ start: "17:00", end: "20:00" }],
        links: [
          { label: "Zur Lieferkarte", href: siteLinks.lieferkarte, style: "primary" },
          { label: "Zu den Liefergebieten", href: siteLinks.liefergebiete, style: "secondary" }
        ],
        hours: {
          1: [],
          2: [{ start: "17:00", end: "20:00" }],
          3: [{ start: "17:00", end: "20:00" }],
          4: [{ start: "17:00", end: "20:00" }],
          5: [{ start: "17:00", end: "20:00" }],
          6: [{ start: "17:00", end: "20:00" }],
          0: [{ start: "17:00", end: "20:00" }]
        }
      }
    ];

    const dayOrder = [1, 2, 3, 4, 5, 6, 0];

    const dayShort = {
      0: "So.",
      1: "Mo.",
      2: "Di.",
      3: "Mi.",
      4: "Do.",
      5: "Fr.",
      6: "Sa."
    };

    const dayFull = {
      0: "Sonntag",
      1: "Montag",
      2: "Dienstag",
      3: "Mittwoch",
      4: "Donnerstag",
      5: "Freitag",
      6: "Samstag"
    };

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function getEasterSunday(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    function getRlpHoliday(date) {
      const year = date.getFullYear();
      const easter = getEasterSunday(year);

      const holidays = {
        [`${year}-01-01`]: "Neujahr",
        [dateKey(addDays(easter, -2))]: "Karfreitag",
        [dateKey(addDays(easter, 1))]: "Ostermontag",
        [`${year}-05-01`]: "Tag der Arbeit",
        [dateKey(addDays(easter, 39))]: "Christi Himmelfahrt",
        [dateKey(addDays(easter, 50))]: "Pfingstmontag",
        [dateKey(addDays(easter, 60))]: "Fronleichnam",
        [`${year}-10-03`]: "Tag der Deutschen Einheit",
        [`${year}-11-01`]: "Allerheiligen",
        [`${year}-12-25`]: "1. Weihnachtstag",
        [`${year}-12-26`]: "2. Weihnachtstag"
      };

      return holidays[dateKey(date)] || null;
    }

    function minutesFromTime(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function formatSlots(slots) {
      if (!slots || slots.length === 0) return "Ruhetag";
      return slots.map(slot => `${slot.start} – ${slot.end}`).join(" / ");
    }

    function isOpenNow(slots, now = new Date()) {
      if (!slots || slots.length === 0) return false;
      const current = now.getHours() * 60 + now.getMinutes();

      return slots.some(slot => {
        const start = minutesFromTime(slot.start);
        const end = minutesFromTime(slot.end);
        return current >= start && current < end;
      });
    }

    function dayLabel(startDay, endDay) {
      if (startDay === endDay) return dayShort[startDay];
      return `${dayShort[startDay]} – ${dayShort[endDay]}`;
    }

    function normalizeSlots(slots) {
      return formatSlots(slots || []);
    }

    function compressHours(hours, holidayHours) {
      const groups = [];
      let currentGroup = null;

      for (const day of dayOrder) {
        const isSunday = day === 0;
        const sundayValue = normalizeSlots(hours[0]);
        const holidayValue = normalizeSlots(holidayHours);
        const value = isSunday && holidayHours && sundayValue === holidayValue
          ? `${sundayValue}__HOLIDAY_WITH_SUNDAY__`
          : formatSlots(hours[day] || []);

        if (!currentGroup) {
          currentGroup = { startDay: day, endDay: day, value };
          continue;
        }

        if (currentGroup.value === value) {
          currentGroup.endDay = day;
        } else {
          groups.push(currentGroup);
          currentGroup = { startDay: day, endDay: day, value };
        }
      }

      if (currentGroup) groups.push(currentGroup);
      return groups;
    }

    function renderRows(area) {
      const groups = compressHours(area.hours, area.holidayHours);
      const sundayValue = normalizeSlots(area.hours[0]);
      const holidayValue = normalizeSlots(area.holidayHours);
      const holidayMergedWithSunday = area.holidayHours && sundayValue === holidayValue;

      const normalRows = groups.map(group => {
        const isHolidaySundayRow = String(group.value).includes("__HOLIDAY_WITH_SUNDAY__");
        const cleanValue = String(group.value).replace("__HOLIDAY_WITH_SUNDAY__", "");
        const label = isHolidaySundayRow ? "So. & Feiertag" : dayLabel(group.startDay, group.endDay);

        return `
          <div class="row">
            <div class="day">${label}</div>
            <div class="time">${cleanValue}</div>
          </div>
        `;
      }).join("");

      const holidayRow = area.holidayHours && !holidayMergedWithSunday ? `
        <div class="row">
          <div class="day">Feiertag</div>
          <div class="time">${formatSlots(area.holidayHours)}</div>
        </div>
      ` : "";

      return normalRows + holidayRow;
    }

    function renderLinks(links) {
      if (!links || !links.length) return "";

      return `
        <div class="links">
          ${links.map(link => `
            <a class="link-btn ${link.style || "primary"}" href="${link.href}" target="_blank" rel="noopener noreferrer">
              ${link.label}
            </a>
          `).join("")}
        </div>
      `;
    }

    function renderLegendIfNeeded(areaKey) {
      if (areaKey !== "liefer") return "";

      return `
        <div class="legend">
          <span class="legend-item"><span class="dot blue"></span>15 €</span>
          <span class="legend-item"><span class="dot orange"></span>20 €</span>
          <span class="legend-item"><span class="dot red"></span>25 €</span>
          <span class="legend-item"><span class="dot gray"></span>35 € außerhalb</span>
        </div>
      `;
    }

    function buildStatusSummary() {
      const summaryEl = document.getElementById("statusSummary");
      const now = new Date();
      const today = now.getDay();
      const holidayName = getRlpHoliday(now);

      summaryEl.innerHTML = areas.map(area => {
        const todaySlots = holidayName && area.holidayHours
          ? area.holidayHours
          : (area.hours[today] || []);

        const open = isOpenNow(todaySlots, now);
        const state = open ? "Geöffnet" : "Geschlossen";
        const stateClass = open ? "open" : "closed";

        return `
          <div class="summary-item">
            <div class="summary-name">
              <span class="summary-dot ${stateClass}"></span>
              <span>${area.title}</span>
            </div>
            <div class="summary-state ${stateClass}">${state}</div>
          </div>
        `;
      }).join("");
    }

    function buildCards() {
      const cardsEl = document.getElementById("cards");
      const now = new Date();
      const today = now.getDay();
      const holidayName = getRlpHoliday(now);

      cardsEl.innerHTML = areas.map(area => {
        const todaySlots = holidayName && area.holidayHours
          ? area.holidayHours
          : (area.hours[today] || []);

        const todayLabelText = holidayName
          ? `Feiertag (${holidayName})`
          : dayFull[today];

        const open = isOpenNow(todaySlots, now);

        return `
          <section class="card">
            <div class="card-head">
              <div class="card-title-wrap">
                <div class="icon ${area.color}">${area.icon}</div>
                <div>
                  <h2>${area.title}</h2>
                  <p class="desc">${area.description}</p>
                </div>
              </div>

              <div class="status ${open ? "open" : "closed"}">
                ${open ? "Geöffnet" : "Geschlossen"}
              </div>
            </div>

            <div class="today-box">
              <div class="today-label">Heute</div>
              <div class="today-value">${todayLabelText}: ${formatSlots(todaySlots)}</div>
            </div>

            <div class="rows">
              ${renderRows(area)}
            </div>

            <div class="notice">${area.notice}</div>
            ${renderLegendIfNeeded(area.key)}
            ${renderLinks(area.links)}
          </section>
        `;
      }).join("");
    }

    function updateTodayDate() {
      const formatter = new Intl.DateTimeFormat("de-DE", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });

      document.getElementById("todayDate").textContent = formatter.format(new Date());
    }

    function renderAll() {
      updateTodayDate();
      buildStatusSummary();
      buildCards();
    }

    renderAll();
    setInterval(renderAll, 60000);
  </script>
</body>
</html>
